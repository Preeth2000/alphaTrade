name: Install TA-Lib
description: Install TA-Lib C library via apt and register it for the Python wrapper.

runs:
  using: composite
  steps:
    - name: Cache TA-Lib build
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          /usr/local/lib/libta*
          /usr/local/include/ta-lib
          /usr/local/bin/ta-lib-config
        key: talib-src-0.4.0-v3-${{ runner.os }}

    - name: Build and install TA-Lib from source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib
        ./configure --prefix=/usr/local CFLAGS="-Wno-format-security"
        # gen_code is a code generator, not needed for runtime install.
        # Stub it out so parallel make has no race to lose.
        printf 'all:\ninstall:\n' > src/tools/gen_code/Makefile
        make -j$(nproc)
        sudo make install

    - name: Register TA-Lib with linker
      shell: bash
      run: sudo ldconfig
