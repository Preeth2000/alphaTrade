name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check alphaTrade/ tests/

  # -----------------------------------------------------------------------
  # Type checking
  # -----------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy alphaTrade

  # -----------------------------------------------------------------------
  # All tests (unit + integration)
  # -----------------------------------------------------------------------
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          SKIP_PARITY: "1"
          T212_API_KEY: ${{ secrets.T212_API_KEY || 'ci-placeholder' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || '' }}
        run: |
          pytest \
            tests/ \
            -m "not slow and not perf" \
            --cov=alphaTrade \
            --cov-report=xml \
            -q

      - name: Check coverage threshold (≥70%)
        if: matrix.python-version == '3.11'
        run: coverage report --fail-under=70

      - name: Upload coverage XML (Codecov)
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false
