name: Nightly

on:
  push:
    branches: [main]
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Integration tests: real yfinance + Polygon APIs
  # -----------------------------------------------------------------------
  integration:
    name: Integration (real APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run integration tests
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY || 'ci-placeholder' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || '' }}
        run: pytest tests/integration/ -v

  # -----------------------------------------------------------------------
  # Performance benchmarks (detect regressions vs stored baseline)
  # -----------------------------------------------------------------------
  perf:
    name: Perf benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run benchmarks
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY || 'ci-placeholder' }}
        run: |
          pytest tests/ -m perf \
            --benchmark-autosave \
            --benchmark-compare-fail=mean:2.0 \
            -v; rc=$?; [ $rc -eq 5 ] && exit 0 || exit $rc

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: .benchmarks/
          retention-days: 30
