name: Weekly

on:
  schedule:
    # Saturday 03:00 UTC
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Mutation testing — verifies tests actually catch logic errors
  # -----------------------------------------------------------------------
  mutation:
    name: Mutation tests (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run mutmut
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY || 'ci-placeholder' }}
        run: mutmut run

      - name: Print results
        if: always()
        run: mutmut results

      - name: Upload mutmut cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutmut-results-${{ github.run_id }}
          path: .mutmut-cache
          retention-days: 30

      - name: Fail if surviving mutants exceed threshold
        run: |
          survived=$(mutmut results 2>&1 | grep -E '^[0-9]+\.' | wc -l || true)
          echo "Surviving mutants: $survived"
          if [ "$survived" -gt 10 ]; then
            echo "Too many surviving mutants ($survived > 10)"
            exit 1
          fi

  # -----------------------------------------------------------------------
  # Slow tests — long sweeps, full Hypothesis runs
  # -----------------------------------------------------------------------
  slow:
    name: Slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: ./.github/actions/install-talib

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run slow tests
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY || 'ci-placeholder' }}
        run: |
          pytest tests/ -m slow -v --timeout=600 \
            || { code=$?; [ $code -eq 5 ] && echo "No slow tests — skipping" && exit 0 || exit $code; }
