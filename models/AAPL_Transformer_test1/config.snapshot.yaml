backtest:
  enabled: true
  fee_bps: 10.0
  fraction: 0.95
  position_sizing: fixed_fraction
  slippage_bps: 5.0
data:
  cache: true
  end: '2026-05-14'
  include_transactions: false
  include_vwap: false
  interval: 1d
  multi:
    alignment: intersection
    enabled: false
    fill: ffill
    tickers: []
  provider: polygon
  start: '2022-01-01'
  ticker: AAPL
export:
  dynamic_batch: true
  opset: 17
  verify_parity: true
features:
  fundamentals:
    announcement_lag_days: 1
    enabled: false
    include_earnings: true
    include_sector: false
  include_ohlcv: true
  indicators:
  - args:
      period: 14
    name: RSI
  - args:
      nbdev: 2
      period: 20
    name: BBANDS
  normalize: zscore
  window: 100
label:
  horizon_bars: 5
  params: {}
  strategy: triple_barrier
model:
  arch: transformer
  params:
    d_model: 64
    dropout: 0.1
    nhead: 8
    num_layers: 2
output_dir: /home/preeth/.alphagen-ui/artifacts
run_name: AAPL_Transformer_test1
sweep:
  enabled: false
  search_space: {}
  trials: 50
train:
  backend: torch
  batch_size: 32
  class_weights: auto
  device: cpu
  early_stop_patience: 10
  epochs: 100
  loss: cross_entropy
  lr: 0.001
  optimizer: adamw
  splits:
    embargo_bars: 5
    n_folds: 5
    type: walk_forward
