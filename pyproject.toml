[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaTrade"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.17.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "ta-lib>=0.4.28",
    "yfinance>=0.2.40",
    "polygon-api-client>=1.13",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.19",
    "apscheduler>=3.10",
    "exchange-calendars>=4.5",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "typer>=0.12",
    "rich>=13.0",
    "python-json-logger>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
alphaTrade = "alphaTrade.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["alphaTrade"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = ["alphaTrade/store/alembic.ini", "alphaTrade/store/migrations/**"]

[tool.setuptools.package-data]
"alphaTrade.store" = ["alembic.ini", "migrations/**/*"]
