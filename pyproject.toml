[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaTrade"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.17.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "ta-lib>=0.4.28",
    "polygon-api-client>=1.13",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.19",
    "apscheduler>=3.10",
    "exchange-calendars>=4.5",
    "pyyaml>=6.0",
    "PyJWT>=2.8",
    "prometheus-client>=0.20",
    "typer>=0.12",
    "rich>=13.0",
    "python-json-logger>=3.2",
    "fastapi>=0.111",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.29",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "redis[asyncio]>=5.0",
    "mlflow-skinny>=2.13",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[project.scripts]
alphaTrade = "alphaTrade.cli:app"

[project.optional-dependencies]
local = [
    "yfinance>=0.2.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "mutmut>=2.4",
    "bandit[toml,sarif]>=1.7",
    "pip-audit>=2.7",
    "pyarrow>=15.0",
    "pact-python>=3.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: tests that hit real external APIs",
    "slow: long-running sweeps and full Hypothesis runs",
    "perf: benchmark tests",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["alphaTrade/store/migrations/"]

[tool.coverage.run]
source = ["alphaTrade"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["alphaTrade"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = ["alphaTrade/store/alembic.ini", "alphaTrade/store/migrations/**"]

[tool.setuptools.package-data]
"alphaTrade.store" = ["alembic.ini", "migrations/**/*"]
